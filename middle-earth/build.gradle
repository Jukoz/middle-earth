def viewerRuntime = providers.gradleProperty('viewer').orElse('both').get()
def supportedViewerRuntimes = ['none', 'jei', 'emi', 'both']
if (!supportedViewerRuntimes.any { it.equalsIgnoreCase(viewerRuntime) }) {
    throw new GradleException("Unsupported recipe viewer runtime '${viewerRuntime}'. Use none, jei, emi, or both.")
}

dependencies {
    implementation project(':sevenstars-api')
    implementation project(':of-beasts-and-wild-things')
    jarJar project(':sevenstars-api')
    jarJar project(':of-beasts-and-wild-things')
    compileOnly 'me.shedaniel:RoughlyEnoughItems-api-neoforge:16.0.799'
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (viewerRuntime.equalsIgnoreCase('emi') || viewerRuntime.equalsIgnoreCase('both')) {
        runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
    }
    if (viewerRuntime.equalsIgnoreCase('jei') || viewerRuntime.equalsIgnoreCase('both')) {
        runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.ow2.asm:asm:9.7.1'
}

sourceSets.main.resources.setSrcDirs(['src/main/generated', 'src/main/resources'])

tasks.named('test') {
    dependsOn tasks.named('runData')
    dependsOn tasks.named('jar')
    useJUnitPlatform()
}

tasks.named('compileTestJava') {
    dependsOn tasks.named('refreshProcessedResources')
}

tasks.named('jar') {
    dependsOn tasks.named('runData')
    dependsOn tasks.named('refreshProcessedResources')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('src/main/generated')
}
